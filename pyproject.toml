[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gate-trade"
version = "0.1.0"
description = "Gate.io spot unilateral accumulation + market-making bot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gate-api>=7.0.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
    "ruff>=0.3",
    "coverage>=7.4",
    "httpx>=0.28",
    "bandit>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gate_trade"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501",
    "N818",  # exception names need not always end with "Error" in financial domain
    "UP042", # str+Enum is more compatible than StrEnum
]

[tool.ruff.lint.isort]
known-first-party = ["gate_trade"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
namespace_packages = false
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "gate_api.*",
    "websockets.*",
    "yaml",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/gate_trade"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]
